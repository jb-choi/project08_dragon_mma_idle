<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #17252b; color: #efe4c5; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
    #game { position: fixed; inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
    #cover, #rotate { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; padding: 24px; background: #17252b; z-index: 3; }
    #rotate { display: none; z-index: 4; }
    h1 { font-size: clamp(22px, 4vw, 40px); margin: 0 0 12px; color: #eac369; }
    p { line-height: 1.6; margin: 8px 0 16px; color: #b6cbbd; }
    button { min-height: 48px; padding: 12px 24px; border: 1px solid #eac369; border-radius: 8px; background: #eac369; color: #17252b; font: inherit; font-weight: 650; touch-action: manipulation; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    progress { width: min(380px, 70vw); height: 14px; margin: 18px auto; accent-color: #83c3a1; }
    #error { max-width: 640px; white-space: pre-wrap; color: #f0a28a; }
    @media (pointer: coarse) and (orientation: portrait) { #rotate { display: grid; } }
  </style>
</head>
<body>
  <main id="game"><canvas id="unity-canvas" width="1920" height="1080" tabindex="0" aria-label="Dragon MMA Idle 게임 화면"></canvas></main>
  <section id="cover">
    <h1>DRAGON / MMA IDLE</h1>
    <p>용을 포획하고, 수련하고, 숲의 기술을 익히세요.<br>전투 영역을 터치해 응원 · 시설 버튼으로 관리</p>
    <progress id="progress" max="1" value="0"></progress>
    <button id="start" disabled>게임 준비 중…</button>
    <p id="status" role="status">처음 실행할 때 데이터를 내려받습니다.</p>
    <p id="error" role="alert"></p>
  </section>
  <section id="rotate"><h1>가로로 돌려주세요</h1><p>이 게임은 가로 화면에 맞춰져 있습니다.<br>기기를 옆으로 돌리면 터치로 플레이할 수 있어요.</p></section>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const start = document.getElementById('start');
    const status = document.getElementById('status');
    const touchDevice = matchMedia('(pointer: coarse)').matches || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    let player;
    async function fullscreen() {
      try {
        if (!document.fullscreenElement && document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
        if (touchDevice && screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
      } catch (_) { /* Safari may require the user to rotate manually. */ }
      canvas.focus();
    }
    start.addEventListener('click', () => { player.SendMessage('Dragon MMA Bootstrap', 'OnBrowserStart', ''); document.getElementById('cover').hidden = true; document.getElementById('cover').style.display = 'none'; canvas.focus(); if (touchDevice) fullscreen(); });
    canvas.addEventListener('pointerdown', () => canvas.focus());
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    function save() { if (player) player.SendMessage('Dragon MMA Bootstrap', 'OnBrowserHidden', ''); }
    document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
    window.addEventListener('pagehide', save);
    const config = {
      dataUrl: 'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: 'Build/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      autoSyncPersistentDataPath: true,
      devicePixelRatio: touchDevice ? 1 : Math.min(2, window.devicePixelRatio || 1),
      showBanner: (message, type) => { if (type === 'error') document.getElementById('error').textContent = message; }
    };
    const loader = document.createElement('script');
    loader.src = 'Build/{{{ LOADER_FILENAME }}}';
    loader.onload = () => createUnityInstance(canvas, config, progress => {
      document.getElementById('progress').value = progress;
      status.textContent = '불러오는 중 ' + Math.round(progress * 100) + '%';
    }).then(instance => {
      player = instance;
      start.disabled = false; start.textContent = '플레이'; status.textContent = '진행 상황은 이 브라우저에 저장됩니다.';
      document.getElementById('progress').hidden = true;
    }).catch(error => { status.textContent = '게임을 시작하지 못했습니다.'; document.getElementById('error').textContent = String(error); });
    loader.onerror = () => { document.getElementById('error').textContent = '게임 파일을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해주세요.'; };
    document.body.appendChild(loader);
  </script>
</body>
</html>
